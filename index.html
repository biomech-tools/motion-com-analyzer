<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Motion COM Analyzer</title>

  <!-- MoveNet Lightning -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection/dist/movenet.js"></script>

  <!-- Excel 保存用：SheetJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <!-- ffmpeg.wasm for frame extraction -->
  <script src="https://unpkg.com/@ffmpeg/ffmpeg@0.12.6/dist/umd/ffmpeg.js"></script>

  <style>
    body { font-family: sans-serif; margin: 20px; }
.canvas-container { position: relative; display: inline-block; }


#canvas {
  height: 75vh;
  max-height: 1000px;
  width: 100%;
  max-width: 100%;
  object-fit: contain;
  border: 1px solid #ccc;
}


    #analysisButtons {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    #flipButton {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 10;
      display: none;
    }

    #fileRow {
      margin-top: 8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #message {
      font-size: 13px;
      font-weight: bold;
      color: red;
    }

    #frameDisplay {
      background: #007bff;
      color: white;
      padding: 4px 8px;
      font-size: 13px;
      border-radius: 4px;
      margin-bottom: 6px;
      width: fit-content;
      white-space: nowrap;
    }

    .main-area {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-top: 10px;
    }

    .main-area > div:last-child {
      position: relative;
    }

    .event-panel {
      position: absolute;
      top: 12px;
      left: 0;
      width: 260px;
      border: none;
      padding: 6px 10px 10px 10px;
      background: transparent;
      pointer-events: auto;
    }

    .event-panel h3 {
      margin-bottom: 6px;
    }

    .event-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body tabindex="0">

<div id="titleBlock" style="margin-bottom:10px;">
  <div style="display:flex; align-items:flex-end; gap:8px;">
    <h2 style="margin:0; font-size:32px;">Motion COM Analyzer</h2>
    <span style="font-size:16px; font-style:italic; color:#555;">v1.0 Beta</span>
  </div>

  <div style="font-size:12px; color:#666; margin-top:-4px; margin-left:2px;">
    – Aiding the manual digitization of joint coordinates using Pose Estimation –
  </div>
</div>

<style>
  #videoInput::-webkit-file-upload-text { visibility: hidden; }
  #videoInput { color: transparent; width: 115px; display: none; }
  #fileSelectBtn, #startAnalysisBtn, #finishBtn, #flipButton {
    height: 36px;
    font-size: 16px;
  }
  .event-memo { width: 40%; }
</style>

<div style="display: flex; align-items: center;">
  <button id="fileSelectBtn">Select a file</button>
  <input type="file" id="videoInput" style="display:none;">

  <div id="fileRow" style="margin-left: 8px; font-size: 14px;">
    <span id="fileName">Still no file selected.</span>
    <span id="message"></span>
  </div>
</div>

<video id="video" preload="auto" style="display:none"></video>

<div class="main-area">

  <div class="canvas-container">
    <canvas id="canvas"></canvas>

    <div style="margin-top:0px; display:inline-block; line-height:0;">
      <input type="range" id="frameSlider" min="0" max="0" step="0.01" value="0" style="width: 600px; margin:0;">
    </div>

    <div id="instructionMessage" style="margin-top:6px; font-size:14px; line-height:1.4; color:black;"></div>

    <div id="keyHint" style="margin-top:6px; font-size:14px; line-height:1.4; display: none;">
      Press <span style="color: red; font-weight: bold;">Enter</span> to advance one frame.
      Press <span style="color: red; font-weight: bold;">Esc</span> to rewind one frame. [Shift + Click = Custom point (CP)]
    </div>

    <button id="flipButton">Flip movie</button>

    <div id="analysisButtons">
      <button id="startAnalysisBtn">Start analysis</button>
      <button id="finishBtn">Finish & Save data</button>
    </div>
  </div>

  <div style="position: relative;">
    <div id="frameDisplay">Frame No. <span id="frameNumber">-</span></div>

    <div class="event-panel">
      <h3>Record events</h3>

      <div class="event-row">
        <button style="height: 30px; padding: 0 15px; font-size: 15px;">A</button>
        <input class="event-memo">
      </div>

      <div class="event-row">
        <button style="height: 30px; padding: 0 15px; font-size: 15px;">B</button>
        <input class="event-memo">
      </div>

      <div class="event-row">
        <button style="height: 30px; padding: 0 15px; font-size: 15px;">C</button>
        <input class="event-memo">
      </div>

      <div class="event-row">
        <button style="height: 30px; padding: 0 15px; font-size: 15px;">D</button>
        <input class="event-memo">
      </div>

    </div>
  </div>

</div>

<style>
  .event-panel h3 { margin-bottom: 6px; }
  .event-row { margin-top: 4px; }
</style>

<script>
  /* ===== Part 1 Script Start ===== */

window.addEventListener("load", () => {
  const lastShown = localStorage.getItem("warningLastShown");
  const now = Date.now();
  const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;

  if (!lastShown || now - lastShown > THIRTY_DAYS) {
    alert("CAUTION: This tool is protected by copyright (©2026 A. Azuma. All Rights Reserved). Unauthorized downloading, copying, or redistribution is prohibited.\n注意：本ツールは著作権により保護されています (©2026 A. Azuma. All Rights Reserved)．無断でのダウンロード，複製，再配布を禁じます．");
    localStorage.setItem("warningLastShown", now);
  }

  // ★★★ 起動ロゴ表示（ここが最重要） ★★★
  mode = "startup";
  const topMargin = 150;
  const bottomMargin = 60;
  const availableHeight = window.innerHeight - topMargin - bottomMargin;

  // 一般的な16:9の動画比率を使用（起動時の横幅を91%に縮小）
  const aspectRatio = 16 / 9;
  canvas.height = availableHeight;
  canvas.width = (availableHeight * aspectRatio) * 0.91;

  drawStartupLogo();
});


  const fileSelectBtn = document.getElementById("fileSelectBtn");
  const videoInput = document.getElementById("videoInput");

  fileSelectBtn.addEventListener("click", () => {
    videoInput.click();
  });

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const message = document.getElementById("message");
  const fileNameSpan = document.getElementById("fileName");
  const frameNumberSpan = document.getElementById("frameNumber");

  const startAnalysisBtn = document.getElementById("startAnalysisBtn");
  const frameSlider = document.getElementById("frameSlider");

  let currentFrame = 0;
  let totalFrames = 0;
  let fps = 29.97;
  let frameDuration = 1 / fps;
  let frameTimestamps = [];

  let mode = "idle";
  let horizontalPoints = [];
  let calibrationPoints = [];
  let rotationAngle = 0;
  let calibrationScale = 1;
  let isFlipped = false;

  let detector = null;
  let joints = [];
  let com = null;
  let draggingIndex = null;

  let currentScale = 1;
  let SCALE_UI = 1;

  let frameData = [];

  const SCORE_TH = 0.4;
  const extractedFrames = [];

  let eventLogs = [];
  let frameSkip = 0;
  let customPoint = null;  // CP (Custom Point) - 各フレームに1点のみ

  const KP_DEF = [
    { id: 4,  name: "R-Ear",      side: "R" },
    { id: 3,  name: "L-Ear",      side: "L" },
    { id: 6,  name: "R-Shoulder", side: "R" },
    { id: 5,  name: "L-Shoulder", side: "L" },
    { id: 8,  name: "R-Elbow",    side: "R" },
    { id: 7,  name: "L-Elbow",    side: "L" },
    { id:10,  name: "R-Wrist",    side: "R" },
    { id: 9,  name: "L-Wrist",    side: "L" },
    { id:12,  name: "R-Hip",      side: "R" },
    { id:11,  name: "L-Hip",      side: "L" },
    { id:14,  name: "R-Knee",     side: "R" },
    { id:13,  name: "L-Knee",     side: "L" },
    { id:16,  name: "R-Ankle",    side: "R" },
    { id:15,  name: "L-Ankle",    side: "L" }
  ];

  function showInstruction(html) {
    const box = document.getElementById("instructionMessage");
    if (box) box.innerHTML = html;
  }

  videoInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const url = URL.createObjectURL(file);
    video.src = url;
    fileNameSpan.textContent = file.name;
    message.textContent = "Movie loading...";
  });



video.addEventListener("loadedmetadata", async () => {
  mode = "horizontal";

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  resizeCanvasToFit();

  const ref = 720;
  const base = Math.min(video.videoWidth, video.videoHeight);
  SCALE_UI = Math.max(1, Math.min(3, base / ref));

  frameSlider.min = 0;
  frameSlider.max = video.duration;
  frameSlider.value = 0;

  message.textContent = "Extracting frame timestamps...";

  await extractFrameTimestamps();

  drawCurrentFrame();
  redrawAll();

  document.getElementById("flipButton").style.display = "block";

  showInstruction(
    `Use the <span style="color:red; font-weight:bold;">scroll bar</span> to move forward or backward through the movie frames.`
  );

  message.textContent = "Horizontal adjustment: Click the first point.";
});

  function resizeCanvasToFit() {
    const topMargin = 150;
    const bottomMargin = 60;

    const availableHeight = window.innerHeight - topMargin - bottomMargin;
    const scaleH = availableHeight / video.videoHeight;

    const availableWidth = window.innerWidth - 40;
    const scaleW = availableWidth / video.videoWidth;

    const scale = Math.min(scaleH, scaleW);

    currentScale = scale;

    canvas.style.height = (video.videoHeight * scale) + "px";
    canvas.style.width  = (video.videoWidth  * scale) + "px";

    frameSlider.style.width = canvas.style.width;
  }

function drawPlus(x, y, color, size = 12 * SCALE_UI) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 3 * SCALE_UI;

  ctx.beginPath();
  ctx.moveTo(x - size, y);
  ctx.lineTo(x + size, y);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x, y - size);
  ctx.lineTo(x, y + size);
  ctx.stroke();
}


  function drawHorizontalPoints() {
    horizontalPoints.forEach(p => drawPlus(p.x, p.y, "red", 12 * SCALE_UI));
  }
  function drawCalibrationPoints() {
    calibrationPoints.forEach(p => drawPlus(p.x, p.y, "blue", 12 * SCALE_UI));
  }

  let blinkOn = true;
  setInterval(() => {
    blinkOn = !blinkOn;
    redrawAll();
  }, 250);

  function layoutMissingJointsLegend() {
    if (!joints || joints.length === 0) return;

    const missing = joints.filter(j => j.estimated);
    if (missing.length === 0) return;

    const placed = joints.filter(j => !j.estimated);

    const canvasW = canvas.width;
    const canvasH = canvas.height;

    const maxX = placed.length ? Math.max(...placed.map(j => j.x)) : canvasW * 0.55;
    const minX = placed.length ? Math.min(...placed.map(j => j.x)) : canvasW * 0.45;

    let legendX = maxX + 80 * SCALE_UI;
    const labelWidth = 100 * SCALE_UI;

    if (legendX + labelWidth > canvasW) {
      legendX = minX - labelWidth;
    }

    const comY = com ? com.y : canvasH * 0.5;
    const gap = 30 * SCALE_UI;

    const upperBody = ["R-Ear", "L-Ear", "R-Shoulder", "L-Shoulder", "R-Elbow", "L-Elbow", "R-Wrist", "L-Wrist"];
    const lowerBody = ["R-Hip", "L-Hip", "R-Knee", "L-Knee", "R-Ankle", "L-Ankle"];

    const missingUpper = [];
    const missingLower = [];

    joints.forEach(j => {
      if (j.estimated) {
        if (upperBody.includes(j.part)) {
          missingUpper.push(j);
        } else if (lowerBody.includes(j.part)) {
          missingLower.push(j);
        }
      }
    });

    let upperStartY = comY - gap * missingUpper.length;
    missingUpper.forEach((j, idx) => {
      j.x = legendX;
      j.y = upperStartY + gap * idx;
    });

    let lowerStartY = comY + gap;
    missingLower.forEach((j, idx) => {
      j.x = legendX;
      j.y = lowerStartY + gap * idx;
    });
  }

  function drawMissingJointsLegend() {
    const missing = joints.filter(j => j.estimated);
    if (missing.length === 0) return;

    missing.forEach(j => {
if (blinkOn) {
  drawPlus(j.x, j.y, "cyan", 6 * SCALE_UI);

  ctx.font = `bold ${21 * SCALE_UI}px sans-serif`;
  ctx.fillStyle = "cyan";
  ctx.fillText(j.part, j.x + 16 * SCALE_UI, j.y + 6 * SCALE_UI);
}

    });
  }

  function drawPosePoints() {
    if (!joints) return;

    const hasUnplaced = joints.some(j => j.estimated);

    joints.forEach(j => {
      if (j.x == null || j.y == null) return;

      let color = (j.side === "R") ? "red" : "green";

      if (j.estimated) {
        color = blinkOn ? "cyan" : "rgba(0,255,255,0.3)";
      }

drawPlus(j.x, j.y, color, 10 * SCALE_UI);

if (!j.estimated) {
  ctx.font = `bold ${21 * SCALE_UI}px sans-serif`;
  ctx.fillStyle = color;
  ctx.fillText(j.part, j.x + 14 * SCALE_UI, j.y + 4 * SCALE_UI);
}

    });

    if (com) {
      const drawCOM = (!hasUnplaced || (hasUnplaced && blinkOn));

if (drawCOM) {
  ctx.beginPath();
  ctx.arc(com.x, com.y, 10 * SCALE_UI, 0, Math.PI * 2);
  ctx.fillStyle = "yellow";
  ctx.fill();
  ctx.strokeStyle = "black";
  ctx.lineWidth = 3 * SCALE_UI;
  ctx.stroke();
}

    }

    // CP (Custom Point) の描画
    if (customPoint && customPoint.x != null && customPoint.y != null) {
      drawPlus(customPoint.x, customPoint.y, "blue", 10 * SCALE_UI);
      ctx.font = `bold ${21 * SCALE_UI}px sans-serif`;
      ctx.fillStyle = "blue";
      ctx.fillText("CP", customPoint.x + 14 * SCALE_UI, customPoint.y + 4 * SCALE_UI);
    }
  }

  function updateCOM() {
    if (!joints || joints.length === 0) {
      com = null;
      return;
    }

    let sumX = 0, sumY = 0, count = 0;
    joints.forEach(j => {
      if (j.x != null && j.y != null) {
        sumX += j.x;
        sumY += j.y;
        count++;
      }
    });

    com = (count > 0) ? { x: sumX / count, y: sumY / count } : null;
  }

  async function initDetector() {
    detector = await poseDetection.createDetector(
      poseDetection.SupportedModels.MoveNet,
      {
        modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING,
        enableSmoothing: false
      }
    );
  }

  document.addEventListener("DOMContentLoaded", async () => {
    await tf.setBackend("webgl");
    await tf.ready();
    await initDetector();
  });

  async function extractFrameTimestamps() {
    try {
      const { FFmpeg } = FFmpegWASM;
      const ffmpeg = new FFmpeg();

      await ffmpeg.load({
        coreURL: "https://unpkg.com/@ffmpeg/core@0.12.4/dist/umd/ffmpeg-core.js"
      });

      const videoBlob = await fetch(video.src).then(r => r.blob());
      const videoData = await videoBlob.arrayBuffer();
      await ffmpeg.writeFile("input.mp4", new Uint8Array(videoData));

      await ffmpeg.exec([
        "-i", "input.mp4",
        "-vf", "showinfo",
        "-f", "null",
        "-"
      ]);

      const logs = await ffmpeg.readFile("ffmpeg.log");
      const logText = new TextDecoder().decode(logs);

      const ptsRegex = /pts_time:([\d.]+)/g;
      const timestamps = [];
      let match;

      while ((match = ptsRegex.exec(logText)) !== null) {
        timestamps.push(parseFloat(match[1]));
      }

      if (timestamps.length === 0) {
        throw new Error("No timestamps extracted");
      }

      frameTimestamps = timestamps;
      totalFrames = frameTimestamps.length;

    } catch (error) {

      frameTimestamps = [];
      totalFrames = Math.floor(video.duration * fps);

      for (let i = 0; i < totalFrames; i++) {
        frameTimestamps.push(i / fps);
      }
    }
  }

  async function runPoseEstimationOnCurrentFrame() {
    if (!detector) return false;

    const small = document.createElement("canvas");
    const sctx = small.getContext("2d");
    small.width = 256;
    small.height = 256;
    sctx.drawImage(canvas, 0, 0, 256, 256);

    const poses = await detector.estimatePoses(small);
    if (!poses || poses.length === 0) {
      joints = [];
      com = null;
      return false;
    }

    const kp = poses[0].keypoints;
    const scaleX = canvas.width / 256;
    const scaleY = canvas.height / 256;

    joints = KP_DEF.map(def => {
      const p = kp[def.id];
      const visible = p.score >= SCORE_TH || (def.name.includes("Ear") && p.score >= 0.2);

      return {
        x: p.x * scaleX,
        y: p.y * scaleY,
        part: def.name,
        side: def.side,
        estimated: !visible,
        score: p.score
      };
    });

    updateCOM();
    layoutMissingJointsLegend();
    return true;
  }

  function drawCurrentFrame() {
    if (video.readyState < 2) return;

    const w = video.videoWidth;
    const h = video.videoHeight;

    canvas.width = w;
    canvas.height = h;

    ctx.clearRect(0, 0, w, h);

    ctx.save();
    ctx.translate(w / 2, h / 2);
    if (isFlipped) {
      ctx.scale(-1, 1);
    }
    ctx.rotate(rotationAngle);
    ctx.drawImage(video, -w / 2, -h / 2, w, h

    );
    ctx.restore();
  }

function redrawAll() {
  if (mode === "startup") return;   // ★ ロゴを守る

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawCurrentFrame();

  // ★ 解析中と完了後は水平補正・キャリブレーションマークを表示しない
  if (mode !== "analysis" && mode !== "done") {
    drawHorizontalPoints();
    drawCalibrationPoints();
  }

  drawPosePoints();
  drawMissingJointsLegend();

  const frameLabel = document.getElementById("frameNumber");

  if (mode === "analysis") {
    frameLabel.textContent = currentFrame + 1;
  } else {
    frameLabel.textContent = "–";
  }
}

  async function seekToFrame(frame) {
    return new Promise(resolve => {
      let done = false;

      const handler = () => {
        if (!done && video.readyState >= 2) {
          done = true;
          video.removeEventListener("seeked", handler);
          // ★ seekedイベント後も少し待機してビデオフレームが完全に準備されるのを待つ
          setTimeout(() => {
            resolve();
          }, 100);
        }
      };

      video.addEventListener("seeked", handler);

      if (frameTimestamps.length > 0 && frame < frameTimestamps.length) {
        video.currentTime = frameTimestamps[frame];
      } else {
        video.currentTime = frame * frameDuration;
      }
      video.pause();

      // ★ タイムアウトを2000msに延長
      setTimeout(() => {
        if (!done) {
          done = true;
          video.removeEventListener("seeked", handler);
          resolve();
        }
      }, 2000);
    });
  }

  async function processCurrentFrame() {
    // ★ 現在のフレームで解析を実行（シークは呼び出し元で実行済み）
    if (currentFrame >= totalFrames) {
      // ★ 最後のフレームに達したら自動的に保存処理へ
      message.textContent = "Analysis complete. Preparing to save data...";
      mode = "done";

      // 保存ボタンをクリックした時と同じ処理を実行
      await new Promise(resolve => setTimeout(resolve, 100));
      const finishButton = document.getElementById("finishBtn");
      if (finishButton) {
        finishButton.click();
      }
      return;
    }

    // ビデオが確実に準備できるまで待機
    let retries = 0;
    while (video.readyState < 2 && retries < 10) {
      await new Promise(resolve => setTimeout(resolve, 50));
      retries++;
    }

    drawCurrentFrame();
    await runPoseEstimationOnCurrentFrame();

    // CPを前のフレームから引き継がない（毎フレームリセット）
    customPoint = null;

    redrawAll();

    // frameDataにjointsとcustomPointを保存する構造に変更
    if (!frameData[currentFrame]) {
      frameData[currentFrame] = {};
    }
    frameData[currentFrame].joints = JSON.parse(JSON.stringify(joints));
    frameData[currentFrame].customPoint = null;

    if (mode === "analysis") {
      frameNumberSpan.textContent = currentFrame + 1;
    } else {
      frameNumberSpan.textContent = "–";
    }
  }

  /* ===== Part 1 End ===== */

  /* ===== Part 2 Start ===== */

  /* ====== クリック処理 ====== */
  canvas.addEventListener("click", async (e) => {
    const { x, y } = getCanvasCoordinates(e);

    if (mode === "horizontal") {
      if (horizontalPoints.length >= 2) return;

      horizontalPoints.push({ x, y });

      if (horizontalPoints.length === 1) {
        message.textContent = "Horizontal adjustment: Click the second point.";
        redrawAll();
        return;
      }

      if (horizontalPoints.length === 2) {
        const dx = horizontalPoints[1].x - horizontalPoints[0].x;
        const dy = horizontalPoints[1].y - horizontalPoints[0].y;
        rotationAngle = -Math.atan2(dy, dx);

        calibrationPoints = [];
        mode = "calibration";
        message.textContent = "Calibration: Click the first point.";
        redrawAll();
        return;
      }
    }

    if (mode === "calibration") {
      if (calibrationPoints.length >= 2) return;

      calibrationPoints.push({ x, y });

      if (calibrationPoints.length === 1) {
        message.textContent = "Calibration: Click the second point.";
        redrawAll();
        return;
      }

      if (calibrationPoints.length === 2) {
        redrawAll();

        document.getElementById("flipButton").style.display = "none";

        setTimeout(async () => {
          const dx = calibrationPoints[1].x - calibrationPoints[0].x;
          const dy = calibrationPoints[1].y - calibrationPoints[0].y;
          const pixelDist = Math.hypot(dx, dy);

          let realDist = prompt(
            "Input the actual distance (meters) between the two points.\nCancel = Retry calibration.\n(Don't switch to a different browser.)",
            "1.0"
          );

          if (realDist === null) {
            alert("Retry horizontal adjustment and calibration again.");

            horizontalPoints = [];
            calibrationPoints = [];
            rotationAngle = 0;
            calibrationScale = 1;

  /* ====== フィルタ処理（Butterworth + Winter residual） ====== */
  function butterworth2Coefficients(fs, fc) {
    const ita = 1 / Math.tan(Math.PI * fc / fs);
    const q = Math.SQRT2;

    let b0 = 1 / (1 + q * ita + ita * ita);
    let b1 = 2 * b0;
    let b2 = b0;

    let a1 = 2 * (ita * ita - 1) * b0;
    let a2 = (1 - q * ita + ita * ita) * b0;

    const gain = (b0 + b1 + b2) / (1 + a1 + a2);
    b0 /= gain;
    b1 /= gain;
    b2 /= gain;

    return { b: [b0, b1, b2], a: [1, a1, a2] };
  }

  function iirFilter(x, b, a) {
    const y = new Array(x.length).fill(0);

    for (let n = 0; n < x.length; n++) {
      y[n] = b[0] * x[n]
           + (n - 1 >= 0 ? b[1] * x[n - 1] : 0)
           + (n - 2 >= 0 ? b[2] * x[n - 2] : 0)
           - (n - 1 >= 0 ? a[1] * y[n - 1] : 0)
           - (n - 2 >= 0 ? a[2] * y[n - 2] : 0);
    }
    return y;
  }

  function padSignal(x, padLen) {
    const n = x.length;
    const actualPadLen = Math.min(padLen, n - 1);
    const padded = new Array(2 * actualPadLen + n);

    // Mirror padding at the beginning
    for (let i = 0; i < actualPadLen; i++) {
      padded[i] = 2 * x[0] - x[actualPadLen - i];
    }

    // Copy original signal
    for (let i = 0; i < n; i++) {
      padded[actualPadLen + i] = x[i];
    }

    // Mirror padding at the end
    for (let i = 0; i < actualPadLen; i++) {
      padded[actualPadLen + n + i] = 2 * x[n - 1] - x[n - 2 - i];
    }

    return padded;
  }

  function zeroPhaseFilter(x, fs, fc, debugName = '') {
    const { b, a } = butterworth2Coefficients(fs, fc);

    // Constant padding: extend with first/last values
    const padLen = Math.max(3 * Math.ceil(fs / fc), 10);
    const paddedLen = x.length + 2 * padLen;
    const padded = new Array(paddedLen);

    // Pad with first value
    for (let i = 0; i < padLen; i++) {
      padded[i] = x[0];
    }

    // Copy original data
    for (let i = 0; i < x.length; i++) {
      padded[padLen + i] = x[i];
    }

    // Pad with last value
    for (let i = 0; i < padLen; i++) {
      padded[padLen + x.length + i] = x[x.length - 1];
    }

    // Forward pass
    let y = iirFilter(padded, b, a);

    // Backward pass
    y = iirFilter(y.slice().reverse(), b, a).reverse();

    // Remove padding and return
    return y.slice(padLen, padLen + x.length);
  }

  function residualRMS(orig, filt) {
    let sum = 0;
    let count = 0;

    for (let i = 0; i < orig.length; i++) {
      if (orig[i] == null) continue;
      const d = orig[i] - filt[i];
      sum += d * d;
      count++;
    }
    if (count === 0) return 0;
    return Math.sqrt(sum / count);
  }

  function linearRegression(xs, ys) {
    const n = xs.length;
    if (n === 0) return { a: 0, b: 0 };

    let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
    for (let i = 0; i < n; i++) {
      const x = xs[i];
      const y = ys[i];
      sumX += x;
      sumY += y;
      sumXY += x * y;
      sumXX += x * x;
    }
    const denom = n * sumXX - sumX * sumX;
    if (denom === 0) return { a: 0, b: sumY / n };

    const a = (n * sumXY - sumX * sumY) / denom;
    const b = (sumY - a * sumX) / n;
    return { a, b };
  }

  function winterResidualAnalysis(orig, fs, debugName) {
    // シンプルに：nullチェックして、有効なデータのみフィルタリング
    const hasNull = orig.some(v => v == null);

    // Nullがある場合は元データをそのまま返す
    if (hasNull) {
      return { fc: 0, filtered: [...orig] };
    }

    const nyquist = fs / 2;
    const maxFc = Math.min(12, nyquist * 0.8);
    const baseCandidates = [4, 6, 8, 10, 12];
    const candidates = baseCandidates.filter(fc => fc < maxFc);

    if (candidates.length === 0) {
      return { fc: 0, filtered: [...orig] };
    }

    const rmsList = [];
    const filtList = [];

    // 各カットオフ周波数でフィルタリング
    for (let i = 0; i < candidates.length; i++) {
      const fc = candidates[i];
      const filt = zeroPhaseFilter(orig, fs, fc, i === 0 && debugName ? debugName : '');
      const rms = residualRMS(orig, filt);
      rmsList.push(rms);
      filtList.push(filt);
    }

    // Winter法：最小RMSを持つ周波数を選択
    // （最もノイズを除去し、かつ信号を保持している周波数）
    let bestIdx = 0;
    let minRms = rmsList[0];
    for (let i = 1; i < rmsList.length; i++) {
      if (rmsList[i] < minRms) {
        minRms = rmsList[i];
        bestIdx = i;
      }
    }

    const bestFc = candidates[bestIdx];
    const bestFilt = filtList[bestIdx];

    return { fc: bestFc, filtered: bestFilt };
  }

        Number(timeSec.toFixed(5)),
        hasEstimated ? null : fmt(comX),
        hasEstimated ? null : fmt(comY),

        fmt(jointConv["R-Ear"].x), fmt(jointConv["R-Ear"].y),
        fmt(jointConv["L-Ear"].x), fmt(jointConv["L-Ear"].y),

        fmt(jointConv["R-Shoulder"].x), fmt(jointConv["R-Shoulder"].y),
        fmt(jointConv["L-Shoulder"].x), fmt(jointConv["L-Shoulder"].y),

        fmt(jointConv["R-Elbow"].x), fmt(jointConv["R-Elbow"].y),
        fmt(jointConv["L-Elbow"].x), fmt(jointConv["L-Elbow"].y),

        fmt(jointConv["R-Wrist"].x), fmt(jointConv["R-Wrist"].y),
        fmt(jointConv["L-Wrist"].x), fmt(jointConv["L-Wrist"].y),

        fmt(jointConv["R-Hip"].x), fmt(jointConv["R-Hip"].y),
        fmt(jointConv["L-Hip"].x), fmt(jointConv["L-Hip"].y),

        fmt(jointConv["R-Knee"].x), fmt(jointConv["R-Knee"].y),
        fmt(jointConv["L-Knee"].x), fmt(jointConv["L-Knee"].y),

        fmt(jointConv["R-Ankle"].x), fmt(jointConv["R-Ankle"].y),
        fmt(jointConv["L-Ankle"].x), fmt(jointConv["L-Ankle"].y),

        fmt(cpX), fmt(cpY),

        (eventLogs.find(e => e.frame === originalFrameNumber)?.label || "")
      ];

      rowsRaw.push(row);
    }

  /* ===== Part 3 続く ===== */

    /* ---------- 3. Filtered の可否判定 ---------- */
    // ★ 解析済みフレームで未抽出座標があるかチェック
    let hasMissing = false;
    for (let i = 0; i < analyzedFrames.length; i++) {
      const jointsFrame = analyzedFrames[i].joints;
      if (jointsFrame.some(j => j.estimated)) {
        hasMissing = true;
        break;
      }
    }

    const tooFewFrames = analyzedFrames.length < 20;

    let allowFiltered = saveFiltered;
    let msg = "";

    if (allowFiltered && hasMissing && !tooFewFrames) {
      allowFiltered = false;
      msg = "Only the raw-data was saved because the analysis included unextracted coodinates.\n\nIf the number of skipped frames is 1 or 2, filtered data will not be obtained.";
    } else if (allowFiltered && !hasMissing && tooFewFrames) {
      allowFiltered = false;
      msg = "Only the raw-data was saved because the number of frames is too less (no less than 20).\n\nIf the number of skipped frames is 1 or 2, filtered data will not be obtained.";
    } else if (allowFiltered && hasMissing && tooFewFrames) {
      allowFiltered = false;
      msg = "Only the raw-data was saved because the analysis included unextracted coodinates. Also, the number of frames is too less (no less than 20).\n\nIf the number of skipped frames is 1 or 2, filtered data will not be obtained.";
    }

    /* ---------- 4. Filtered データ生成（解析済みフレームのみ） ---------- */
    let rowsFiltered = null;

    // ★ フレームスキップがある場合はフィルター処理を完全にスキップ
    if (frameSkip > 0) {
      allowFiltered = false;
    }

    if (allowFiltered) {
      const filteredMap = {};
      const cfMap = {};

      // ★ Butterworthパラメータを計算（最初の関節点から取得）
      let butterworthParams = null;
      const firstJointName = KP_DEF[0].name;
      const firstSeries = seriesMap[firstJointName].x;
      if (firstSeries.length > 0) {
        const resX = winterResidualAnalysis(firstSeries, fps, null);
        const nyquist = fps / 2;
        const coeff = butterworth2Coefficients(fps, resX.fc);
        butterworthParams = {
          inputFps: fps,
          samplingFreq: fps,
          nyquistFreq: nyquist,
          a: coeff.a,
          b: coeff.b
        };
      }

      // ★ 解析済みフレームの時系列データに対してフィルター処理
      KP_DEF.forEach(def => {
        const name = def.name;
        const sx = seriesMap[name].x;
        const sy = seriesMap[name].y;

        const resX = winterResidualAnalysis(sx, fps, null);
        const resY = winterResidualAnalysis(sy, fps, null);

        filteredMap[name] = {
          x: resX.filtered,
          y: resY.filtered
        };
        cfMap[name] = {
          x: resX.fc,
          y: resY.fc
        };
      });

      rowsFiltered = [];
      rowsFiltered.push(header);

      // ★ 解析済みフレームのみを出力
      for (let i = 0; i < analyzedFrames.length; i++) {
        const originalFrameNumber = analyzedFrames[i].frameNumber;

        // COM計算（フィルター後）
        let sumX = 0, sumY = 0, count = 0;
        KP_DEF.forEach(def => {
          const x = filteredMap[def.name].x[i];
          const y = filteredMap[def.name].y[i];
          if (x != null && y != null) {
            sumX += x;
            sumY += y;
            count++;
          }
        });
        const comXf = (count > 0) ? (sumX / count) : null;
        const comYf = (count > 0) ? (sumY / count) : null;

        const timeSec = originalFrameNumber / fps;

        // ★ ゼロ位相フィルター使用のため境界効果は最小限
        const blank = false;

        // CP座標（フィルター処理しない、Rawそのまま）
        // ★ CPは端点4フレームでも表示する
        const cp = analyzedFrames[i].customPoint;
        let cpX = null, cpY = null;
        if (cp && cp.x != null && cp.y != null) {
          cpX = cp.x * scale;
          cpY = -(cp.y - baselineY) * scale;
        }

        const row = [
          originalFrameNumber + 1,
          Number(timeSec.toFixed(5)),

          blank ? null : fmt(comXf),
          blank ? null : fmt(comYf),

          blank ? null : fmt(filteredMap["R-Ear"].x[i]), blank ? null : fmt(filteredMap["R-Ear"].y[i]),
          blank ? null : fmt(filteredMap["L-Ear"].x[i]), blank ? null : fmt(filteredMap["L-Ear"].y[i]),

          blank ? null : fmt(filteredMap["R-Shoulder"].x[i]), blank ? null : fmt(filteredMap["R-Shoulder"].y[i]),
          blank ? null : fmt(filteredMap["L-Shoulder"].x[i]), blank ? null : fmt(filteredMap["L-Shoulder"].y[i]),

          blank ? null : fmt(filteredMap["R-Elbow"].x[i]), blank ? null : fmt(filteredMap["R-Elbow"].y[i]),
          blank ? null : fmt(filteredMap["L-Elbow"].x[i]), blank ? null : fmt(filteredMap["L-Elbow"].y[i]),

          blank ? null : fmt(filteredMap["R-Wrist"].x[i]), blank ? null : fmt(filteredMap["R-Wrist"].y[i]),
          blank ? null : fmt(filteredMap["L-Wrist"].x[i]), blank ? null : fmt(filteredMap["L-Wrist"].y[i]),

          blank ? null : fmt(filteredMap["R-Hip"].x[i]), blank ? null : fmt(filteredMap["R-Hip"].y[i]),
          blank ? null : fmt(filteredMap["L-Hip"].x[i]), blank ? null : fmt(filteredMap["L-Hip"].y[i]),

          blank ? null : fmt(filteredMap["R-Knee"].x[i]), blank ? null : fmt(filteredMap["R-Knee"].y[i]),
          blank ? null : fmt(filteredMap["L-Knee"].x[i]), blank ? null : fmt(filteredMap["L-Knee"].y[i]),

          blank ? null : fmt(filteredMap["R-Ankle"].x[i]), blank ? null : fmt(filteredMap["R-Ankle"].y[i]),
          blank ? null : fmt(filteredMap["L-Ankle"].x[i]), blank ? null : fmt(filteredMap["L-Ankle"].y[i]),

          fmt(cpX), fmt(cpY),  // ★ CPは端点でもblankフラグを適用しない

          (eventLogs.find(e => e.frame === originalFrameNumber)?.label || "")
        ];

        rowsFiltered.push(row);
      }

      const cfRow = [];
      cfRow.push("cf-freq","","","");

      function pushCf(name) {
cfRow.push(Math.round(cfMap[name].x));
cfRow.push(Math.round(cfMap[name].y));

      }

      pushCf("R-Ear");
      pushCf("L-Ear");
      pushCf("R-Shoulder");
      pushCf("L-Shoulder");
      pushCf("R-Elbow");
      pushCf("L-Elbow");
      pushCf("R-Wrist");
      pushCf("L-Wrist");
      pushCf("R-Hip");
      pushCf("L-Hip");
      pushCf("R-Knee");
      pushCf("L-Knee");
      pushCf("R-Ankle");
      pushCf("L-Ankle");

      cfRow.push("");
      rowsFiltered.push(cfRow);

      // ★ 修正2：A列（Cut-off freq.の下）にメッセージを追加
      const noteRow = ["Consider excluding the first and last 3 to 5 data points."];
      rowsFiltered.push(noteRow);

      // ★ 修正1：AJ列にフィルターパラメータを追加
      if (butterworthParams) {
        // AJ列は36列目（インデックス35）
        const paramCol = 35;

        // ヘッダー行からスタート
        let paramRowIndex = 0;

        // パラメータ情報を追加
        const paramLines = [
          "Filtering Parameters",
          `Input fps: ${butterworthParams.inputFps}`,
          `Sampling freq (Hz): ${butterworthParams.samplingFreq}`,
          `Nyquist freq (Hz): ${butterworthParams.nyquistFreq.toFixed(2)}`,
          "Filter type: 2nd-order Butterworth low-pass",
          "",
          "Coefficient of Butterworth:",
          "a (denominator)",
          `a[0]=${butterworthParams.a[0].toFixed(6)}`,
          `a[1]=${butterworthParams.a[1].toFixed(6)}`,
          `a[2]=${butterworthParams.a[2].toFixed(6)}`,
          "",
          "b (numerator)",
          `b[0]=${butterworthParams.b[0].toFixed(6)}`,
          `b[1]=${butterworthParams.b[1].toFixed(6)}`,
          `b[2]=${butterworthParams.b[2].toFixed(6)}`
        ];

        paramLines.forEach((line, i) => {
          if (!rowsFiltered[i]) {
            rowsFiltered[i] = [];
          }
          // AJ列まで配列を拡張
          while (rowsFiltered[i].length < paramCol + 1) {
            rowsFiltered[i].push("");
          }
          rowsFiltered[i][paramCol] = line;
        });
      }
    }

    /* ---------- 5. Excel 1ファイル保存 ---------- */

    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, "0");
    const dd = String(now.getDate()).padStart(2, "0");
    const hh = String(now.getHours()).padStart(2, "0");
    const mi = String(now.getMinutes()).padStart(2, "0");

    const baseFilename = `CoodinateData-${yyyy}${mm}${dd}-${hh}${mi}`;

    const wb = XLSX.utils.book_new();

    if (saveRaw) {
      const wsRaw = XLSX.utils.aoa_to_sheet(rowsRaw);
      XLSX.utils.book_append_sheet(wb, wsRaw, "Raw");
    }

    if (allowFiltered && rowsFiltered) {
      const wsFiltered = XLSX.utils.aoa_to_sheet(rowsFiltered);
      XLSX.utils.book_append_sheet(wb, wsFiltered, "Filtered");
    }

    XLSX.writeFile(wb, baseFilename + ".xlsx");

    // ★ ダイアログ表示中のタブ切り替え・フォーカス喪失を検出（alert表示前から監視開始）
    let dialogInterrupted = false;
    const visibilityChangeHandler = () => {
      if (document.hidden) {
        dialogInterrupted = true;
      }
    };
    const blurHandler = () => {
      dialogInterrupted = true;
    };

    document.addEventListener("visibilitychange", visibilityChangeHandler);
    window.addEventListener("blur", blurHandler);

    if (saveRaw && allowFiltered) {
      alert("The data has been saved in Excel format.\n\nIf the number of skipped frames was 1 or 2, only the raw-data was saved.\n\n(Don't switch to a different browser.)");
    } else if (saveRaw && !allowFiltered && msg) {
      alert(msg + "\n\n(Don't switch to a different browser.)");
    } else if (saveRaw && !allowFiltered && !msg && frameSkip > 0) {
      alert("The data has been saved in Excel format.\n\nIf the number of skipped frames was 1 or 2, only the raw-data was saved.\n\n(Don't switch to a different browser.)");
    }

    // ★ ダイアログ表示前の時刻を記録
    const dialogStartTime = Date.now();
    const next = confirm("Proceed new analysis?\nCancel = Close program\n\n(Don't switch to a different browser.)");
    const dialogEndTime = Date.now();

    // ★ イベントリスナーを解除
    document.removeEventListener("visibilitychange", visibilityChangeHandler);
    window.removeEventListener("blur", blurHandler);

    // ★ ダイアログが100ms未満で閉じられた場合、またはタブ切り替え/フォーカス喪失があった場合は、意図しないキャンセルの可能性
    const dialogDuration = dialogEndTime - dialogStartTime;
    if ((dialogDuration < 100 || dialogInterrupted) && !next) {
      alert("The dialog box closed unexpectedly. Please click \"Finish & Save data\" again.");
      return;
    }

    if (next) {
      mode = "startup";
      drawStartupLogo();
      location.reload();
    } else {
      window.close();
    }
  }

  /* ===== Part 3 End ===== */


  /* ===== Part 4 Start ===== */

  /* ====== Flip Movie ボタン ====== */
  const flipButton = document.getElementById("flipButton");
  flipButton.addEventListener("click", () => {
    if (mode !== "horizontal" && mode !== "calibration") return;

    isFlipped = !isFlipped;
    drawCurrentFrame();
    redrawAll();
  });

  /* ====== Start / Finish ボタン ====== */
startAnalysisBtn.addEventListener("click", async () => {
  if (mode !== "ready") {
    alert("Calibration is not completed yet.");
    return;
  }

  startAnalysisBtn.blur();

  // ★ currentFrame変数には既にユーザーが選択したフレーム番号が入っているので、
  // video.currentTimeから再計算せず、currentFrame変数の値をそのまま使用
  // （スクロールバーや矢印キーで移動した時に正しく設定されている）

  // ★ 念のため範囲チェック
  if (currentFrame >= totalFrames) {
    currentFrame = totalFrames - 1;
  }
  if (currentFrame < 0) {
    currentFrame = 0;
  }

  // ★ ビデオを指定されたフレームに確実にシーク（複数回実行で確実性を高める）
  await seekToFrame(currentFrame);

  // ★ ビデオが完全に準備できるまで待機
  let retries = 0;
  while (video.readyState < 2 && retries < 10) {
    await new Promise(resolve => setTimeout(resolve, 50));
    retries++;
  }

  // ★ 少し待機してからもう一度シーク
  await new Promise(resolve => setTimeout(resolve, 100));
  await seekToFrame(currentFrame);

  // ★ さらに少し待機
  await new Promise(resolve => setTimeout(resolve, 100));

  // ★ 最後にもう一度シークして、確実に目的のフレームに位置する
  await seekToFrame(currentFrame);

  // ★ 最終確認：ビデオが準備できるまで待機
  retries = 0;
  while (video.readyState < 2 && retries < 10) {
    await new Promise(resolve => setTimeout(resolve, 50));
    retries++;
  }

  // ★ 期待される時刻を計算
  let expectedTime;
  if (frameTimestamps.length > 0 && currentFrame < frameTimestamps.length) {
    expectedTime = frameTimestamps[currentFrame];
  } else {
    expectedTime = currentFrame * frameDuration;
  }

  // ★ ビデオの時刻が期待値から大きくずれている場合は、もう一度シーク
  const timeDiff = Math.abs(video.currentTime - expectedTime);
  if (timeDiff > frameDuration * 0.5) {
    await seekToFrame(currentFrame);
    await new Promise(resolve => setTimeout(resolve, 200));
  }

  // 現在のフレームで解析を試行
  drawCurrentFrame();
  const poseDetected = await runPoseEstimationOnCurrentFrame();

  // ★ 人が検出されなかった場合の処理
  if (!poseDetected) {
    alert('Move to the frame to be analyzed and press the "Start Analysis" button again.');

    // mode を ready に戻す（スクロールバーと矢印キー操作可能）
    mode = "ready";
    message.textContent = "Analysis is ready: Press \"Start analysis\".";

    // 操作可能メッセージを表示
    showInstruction(
      `Use the <span style="color:red; font-weight:bold;">scroll bar</span> or <span style="color:red; font-weight:bold;">arrow keys</span> to move through frames.`
    );

    redrawAll();
    return;
  }

  // ★ 人が検出された場合は解析を開始
  mode = "analysis";
  message.textContent = "Analyzing...";

  // まず以前のメッセージを消す
  showInstruction("");

  // keyHint（Enter / Esc の説明）を更新して表示
  const keyHintDiv = document.getElementById("keyHint");
  if (frameSkip === 0) {
    keyHintDiv.innerHTML = 'Press <span style="color: red; font-weight: bold;">Enter</span> to advance one frame. Press <span style="color: red; font-weight: bold;">Esc</span> to rewind one frame. [Shift + Click = Custom point (CP)]';
  } else if (frameSkip === 1) {
    keyHintDiv.innerHTML = 'Press <span style="color: red; font-weight: bold;">Enter</span> to advance by skipping one frame. Press <span style="color: red; font-weight: bold;">Esc</span> to rewind by skipping one frame. [Shift + Click = Custom point (CP)]';
  } else {
    keyHintDiv.innerHTML = 'Press <span style="color: red; font-weight: bold;">Enter</span> to advance by skipping two frames. Press <span style="color: red; font-weight: bold;">Esc</span> to rewind by skipping two frames. [Shift + Click = Custom point (CP)]';
  }
  keyHintDiv.style.display = "block";

  frameData = [];

  redrawAll();

  if (!frameData[currentFrame]) {
    frameData[currentFrame] = {};
  }
  frameData[currentFrame].joints = JSON.parse(JSON.stringify(joints));
  frameData[currentFrame].customPoint = null;
  frameNumberSpan.textContent = currentFrame + 1;
});

const finishBtn = document.getElementById("finishBtn");
finishBtn.addEventListener("click", () => {
  // ★ 解析中または完了後のみ許可（"done"モードも許可）
  if (mode !== "analysis" && mode !== "done") {
    alert("Analysis has not started yet.");
    return;
  }

  // ★ 解析終了なので keyHint を隠す
  document.getElementById("keyHint").style.display = "none";

  // ★ ダイアログ表示中のタブ切り替え・フォーカス喪失を検出
  let dialogInterrupted = false;

  const visibilityChangeHandler = () => {
    if (document.hidden) {
      dialogInterrupted = true;
    }
  };

  document.addEventListener("visibilitychange", visibilityChangeHandler);

  // ★ ダイアログ表示前の時刻を記録
  const dialogStartTime = Date.now();
  const shouldSave = confirm("Save the raw and (if possible) the filtered data in Excel format?\nIn frame-skipped analysis, filtered data is not saved.\n\nCancel = No\n\n(Don't switch to a different browser.)");
  const dialogEndTime = Date.now();

  // ★ イベントをキャプチャする時間を確保してから判定
  setTimeout(() => {
    document.removeEventListener("visibilitychange", visibilityChangeHandler);

    const dialogDuration = dialogEndTime - dialogStartTime;

    // ★ OKを選択した場合は保存処理へ
    if (shouldSave) {
      const saveRaw = true;
      const saveFiltered = true;
      runSaveProcess(saveRaw, saveFiltered);
    } else {
      // ★ Cancelを選択した場合：タブ切り替えがあった場合のみ警告
      if (dialogInterrupted) {
        alert("The dialog box closed unexpectedly. Please click \"Finish & Save data\" again.");
        document.getElementById("keyHint").style.display = "block";
        return;
      }

      // ★ 正常にCancelを選択した場合は次のダイアログへ
      // ★ 2つ目のダイアログでも同様の保護を追加
      let dialogInterrupted2 = false;

      const visibilityChangeHandler2 = () => {
        if (document.hidden) {
          dialogInterrupted2 = true;
        }
      };

      document.addEventListener("visibilitychange", visibilityChangeHandler2);

      const dialog2StartTime = Date.now();
      const next = confirm("Proceed new analysis?\nCancel = Close program\n(Don't switch to a different browser.)");
      const dialog2EndTime = Date.now();

      // ★ イベントをキャプチャする時間を確保してから判定
      setTimeout(() => {
        document.removeEventListener("visibilitychange", visibilityChangeHandler2);

        const dialog2Duration = dialog2EndTime - dialog2StartTime;

        // ★ OKを選択した場合は新しい分析へ
        if (next) {
          mode = "startup";
          drawStartupLogo();
          location.reload();
        } else {
          // ★ Cancelを選択した場合：タブ切り替えがあった場合のみ警告
          if (dialogInterrupted2) {
            alert("The dialog box closed unexpectedly. Please click \"Finish & Save data\" again.");
            document.getElementById("keyHint").style.display = "block";
            return;
          }

          // ★ 正常にCancelを選択した場合はプログラムを閉じる
          window.close();
        }
      }, 50);
    }
  }, 50);
});

  /* ====== 座標変換 ====== */
  function getCanvasCoordinates(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);
    return { x, y };
  }



  /* ===== Part 4 End ===== */
</script>
