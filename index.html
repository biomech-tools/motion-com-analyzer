<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Motion COM Analyzer</title>

  <!-- MoveNet Lightning -->
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@3.21.0/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs-backend-webgl"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/pose-detection/dist/movenet.js"></script>

  <!-- Excel 保存用：SheetJS -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

  <style>
    body { font-family: sans-serif; margin: 20px; }
.canvas-container { position: relative; display: inline-block; }


#canvas {
  height: 75vh;
  max-height: 1000px;
  width: 100%;
  max-width: 100%
  object-fit: contain;
  border: 1px solid #ccc;

}


    #analysisButtons {
      position: absolute;
      top: 10px;
      right: 10px;
      display: flex;
      gap: 8px;
      z-index: 10;
    }

    #fileRow {
      margin-top: 8px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    #message {
      font-size: 13px;
      font-weight: bold;
      color: red;
    }

    #frameDisplay {
      background: #007bff;
      color: white;
      padding: 4px 8px;
      font-size: 13px;
      border-radius: 4px;
      margin-bottom: 6px;
      width: fit-content;
      white-space: nowrap;
    }

    .main-area {
      display: flex;
      align-items: flex-start;
      gap: 20px;
      margin-top: 10px;
    }

    .main-area > div:last-child {
      position: relative;
    }

    .event-panel {
      position: absolute;
      top: 12px;
      left: 0;
      width: 260px;
      border: none;
      padding: 6px 10px 10px 10px;
      background: transparent;
      pointer-events: auto;
    }

    .event-panel h3 {
      margin-bottom: 6px;
    }

    .event-row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    canvas {
      display: block;
    }
  </style>
</head>

<body tabindex="0">

<div id="titleBlock" style="margin-bottom:10px;">
  <div style="display:flex; align-items:flex-end; gap:8px;">
    <h2 style="margin:0; font-size:32px;">Motion COM Analyzer</h2>
    <span style="font-size:16px; font-style:italic; color:#555;">v1.0 Beta</span>
  </div>

  <div style="font-size:12px; color:#666; margin-top:-4px; margin-left:2px;">
    – Aiding the manual digitization of joint coordinates using Pose Estimation –
  </div>
</div>

<style>
  #videoInput::-webkit-file-upload-text { visibility: hidden; }
  #videoInput { color: transparent; width: 115px; display: none; }
  #fileSelectBtn, #startAnalysisBtn, #finishBtn {
    height: 36px;
    font-size: 16px;
  }
  .event-memo { width: 40%; }
</style>

<div style="display: flex; align-items: center;">
  <button id="fileSelectBtn">Select a file</button>
  <input type="file" id="videoInput" style="display:none;">

  <div id="fileRow" style="margin-left: 8px; font-size: 14px;">
    <span id="fileName">Still no file selected.</span>
    <span id="message"></span>
  </div>
</div>

<video id="video" preload="auto" style="display:none"></video>

<div class="main-area">

  <div class="canvas-container">
    <canvas id="canvas"></canvas>

    <div style="margin-top:0px; display:inline-block; line-height:0;">
      <input type="range" id="frameSlider" min="0" max="0" step="0.01" value="0" style="width: 600px; margin:0;">
    </div>

    <div id="instructionMessage" style="margin-top:6px; font-size:14px; color:black;"></div>

    <div id="keyHint" style="margin-top: 10px; font-size: 16px; display: none;">
      Press <span style="color: red; font-weight: bold;">Enter</span> to advance one frame.
      Press <span style="color: red; font-weight: bold;">Esc</span> to rewind one frame.
    </div>

    <div id="analysisButtons">
      <button id="startAnalysisBtn">Start Analysis</button>
      <button id="finishBtn">Finish & Save data</button>
    </div>
  </div>

  <div style="position: relative;">
    <div id="frameDisplay">Frame No. <span id="frameNumber">-</span></div>

    <div class="event-panel">
      <h3>Record Events</h3>

      <div class="event-row">
        <button style="height: 30px; padding: 0 15px; font-size: 15px;">A</button>
        <input class="event-memo">
      </div>

      <div class="event-row">
        <button style="height: 30px; padding: 0 15px; font-size: 15px;">B</button>
        <input class="event-memo">
      </div>

      <div class="event-row">
        <button style="height: 30px; padding: 0 15px; font-size: 15px;">C</button>
        <input class="event-memo">
      </div>

      <div class="event-row">
        <button style="height: 30px; padding: 0 15px; font-size: 15px;">D</button>
        <input class="event-memo">
      </div>

    </div>
  </div>

</div>

<style>
  .event-panel h3 { margin-bottom: 6px; }
  .event-row { margin-top: 4px; }
</style>

<script>
  /* ===== Part 1 Script Start ===== */

window.addEventListener("load", () => {
  const lastShown = localStorage.getItem("warningLastShown");
  const now = Date.now();
  const THIRTY_DAYS = 30 * 24 * 60 * 60 * 1000;

  if (!lastShown || now - lastShown > THIRTY_DAYS) {
    alert("CAUTION: This tool is protected by copyright (©2026 A. Azuma. All Rights Reserved). Unauthorized downloading, copying, or redistribution is prohibited.\n注意：本ツールは著作権により保護されています (©2026 A. Azuma. All Rights Reserved)．無断でのダウンロード，複製，再配布を禁じます．");
    localStorage.setItem("warningLastShown", now);
  }

  // ★★★ 起動ロゴ表示（ここが最重要） ★★★
  mode = "startup";
  canvas.width = 1280;
  canvas.height = 720;
  drawStartupLogo();
});


  const fileSelectBtn = document.getElementById("fileSelectBtn");
  const videoInput = document.getElementById("videoInput");

  fileSelectBtn.addEventListener("click", () => {
    videoInput.click();
  });

  const video = document.getElementById("video");
  const canvas = document.getElementById("canvas");
  const ctx = canvas.getContext("2d");

  const message = document.getElementById("message");
  const fileNameSpan = document.getElementById("fileName");
  const frameNumberSpan = document.getElementById("frameNumber");

  const startAnalysisBtn = document.getElementById("startAnalysisBtn");
  const frameSlider = document.getElementById("frameSlider");

  let currentFrame = 0;
  let totalFrames = 0;
  let fps = 29.97;
  let frameDuration = 1 / fps;

  let mode = "idle";
  let horizontalPoints = [];
  let calibrationPoints = [];
  let rotationAngle = 0;
  let calibrationScale = 1;

  let detector = null;
  let joints = [];
  let com = null;
  let draggingIndex = null;

  let currentScale = 1;
  let SCALE_UI = 1;

  let frameData = [];

  const SCORE_TH = 0.4;
  const extractedFrames = [];

  let eventLogs = [];

  const KP_DEF = [
    { id: 4,  name: "R-Ear",      side: "R" },
    { id: 3,  name: "L-Ear",      side: "L" },
    { id: 6,  name: "R-Shoulder", side: "R" },
    { id: 5,  name: "L-Shoulder", side: "L" },
    { id: 8,  name: "R-Elbow",    side: "R" },
    { id: 7,  name: "L-Elbow",    side: "L" },
    { id:10,  name: "R-Wrist",    side: "R" },
    { id: 9,  name: "L-Wrist",    side: "L" },
    { id:12,  name: "R-Hip",      side: "R" },
    { id:11,  name: "L-Hip",      side: "L" },
    { id:14,  name: "R-Knee",     side: "R" },
    { id:13,  name: "L-Knee",     side: "L" },
    { id:16,  name: "R-Ankle",    side: "R" },
    { id:15,  name: "L-Ankle",    side: "L" }
  ];

  function showInstruction(html) {
    const box = document.getElementById("instructionMessage");
    if (box) box.innerHTML = html;
  }

  videoInput.addEventListener("change", (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const url = URL.createObjectURL(file);
    video.src = url;
    fileNameSpan.textContent = file.name;
    message.textContent = "Movie loading...";
  });



video.addEventListener("loadedmetadata", () => {
  mode = "horizontal";   // ★ startup 終了

  ctx.clearRect(0, 0, canvas.width, canvas.height);
  resizeCanvasToFit();

 
const ref = 720;
const base = Math.min(video.videoWidth, video.videoHeight);
SCALE_UI = Math.max(1, Math.min(3, base / ref));



  frameSlider.min = 0;
  frameSlider.max = video.duration;
  frameSlider.value = 0;

  drawCurrentFrame();
  redrawAll();

  showInstruction(
    `Use the <span style="color:red;">scroll bar</span> to move forward or backward through the movie frames.`
  );

  message.textContent = "Horizontal Adjustment: Click the first point.";
});

  function resizeCanvasToFit() {
    const topMargin = 150;
    const bottomMargin = 60;

    const availableHeight = window.innerHeight - topMargin - bottomMargin;
    const scaleH = availableHeight / video.videoHeight;

    const availableWidth = window.innerWidth - 40;
    const scaleW = availableWidth / video.videoWidth;

    const scale = Math.min(scaleH, scaleW);

    currentScale = scale;

    canvas.style.height = (video.videoHeight * scale) + "px";
    canvas.style.width  = (video.videoWidth  * scale) + "px";

    frameSlider.style.width = canvas.style.width;
  }

function drawPlus(x, y, color, size = 12 * SCALE_UI) {
  ctx.strokeStyle = color;
  ctx.lineWidth = 3 * SCALE_UI;

  ctx.beginPath();
  ctx.moveTo(x - size, y);
  ctx.lineTo(x + size, y);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(x, y - size);
  ctx.lineTo(x, y + size);
  ctx.stroke();
}


  function drawHorizontalPoints() {
    horizontalPoints.forEach(p => drawPlus(p.x, p.y, "red", 26));
  }
  function drawCalibrationPoints() {
    calibrationPoints.forEach(p => drawPlus(p.x, p.y, "blue", 26));
  }

  let blinkOn = true;
  setInterval(() => {
    blinkOn = !blinkOn;
    redrawAll();
  }, 250);

  function layoutMissingJointsLegend() {
    if (!joints || joints.length === 0) return;

    const missing = joints.filter(j => j.estimated);
    if (missing.length === 0) return;

    const placed = joints.filter(j => !j.estimated);

    const canvasW = canvas.width;
    const canvasH = canvas.height;

    const maxX = placed.length ? Math.max(...placed.map(j => j.x)) : canvasW * 0.55;
    const minX = placed.length ? Math.min(...placed.map(j => j.x)) : canvasW * 0.45;

    let legendX = maxX + 80;
    const labelWidth = 100;

    if (legendX + labelWidth > canvasW) {
      legendX = minX - labelWidth;
    }

    const baseY = canvasH * 0.35;
    const gap = 75;




    let idx = 0;
    joints.forEach(j => {
      if (j.estimated) {
        j.x = legendX;
        j.y = baseY + gap * idx++;
      }
    });
  }

  function drawMissingJointsLegend() {
    const missing = joints.filter(j => j.estimated);
    if (missing.length === 0) return;

    missing.forEach(j => {
if (blinkOn) {
  drawPlus(j.x, j.y, "cyan", 6 * SCALE_UI);

  ctx.font = `bold ${21 * SCALE_UI}px sans-serif`;
  ctx.fillStyle = "cyan";
  ctx.fillText(j.part, j.x + 16 * SCALE_UI, j.y + 6 * SCALE_UI);
}

    });
  }

  function drawPosePoints() {
    if (!joints) return;

    const hasUnplaced = joints.some(j => j.estimated);

    joints.forEach(j => {
      if (j.x == null || j.y == null) return;

      let color = (j.side === "R") ? "red" : "green";

      if (j.estimated) {
        color = blinkOn ? "cyan" : "rgba(0,255,255,0.3)";
      }

drawPlus(j.x, j.y, color, 10 * SCALE_UI);

if (!j.estimated) {
  ctx.font = `bold ${21 * SCALE_UI}px sans-serif`;
  ctx.fillStyle = color;
  ctx.fillText(j.part, j.x + 14 * SCALE_UI, j.y + 4 * SCALE_UI);
}

    });

    if (com) {
      const drawCOM = (!hasUnplaced || (hasUnplaced && blinkOn));

if (drawCOM) {
  ctx.beginPath();
  ctx.arc(com.x, com.y, 10 * SCALE_UI, 0, Math.PI * 2);
  ctx.fillStyle = "yellow";
  ctx.fill();
  ctx.strokeStyle = "black";
  ctx.lineWidth = 3 * SCALE_UI;
  ctx.stroke();
}

    }
  }

  function updateCOM() {
    if (!joints || joints.length === 0) {
      com = null;
      return;
    }

    let sumX = 0, sumY = 0, count = 0;
    joints.forEach(j => {
      if (j.x != null && j.y != null) {
        sumX += j.x;
        sumY += j.y;
        count++;
      }
    });

    com = (count > 0) ? { x: sumX / count, y: sumY / count } : null;
  }

  async function initDetector() {
    detector = await poseDetection.createDetector(
      poseDetection.SupportedModels.MoveNet,
      {
        modelType: poseDetection.movenet.modelType.SINGLEPOSE_LIGHTNING,
        enableSmoothing: false
      }
    );
  }

  document.addEventListener("DOMContentLoaded", async () => {
    await tf.setBackend("webgl");
    await tf.ready();
    await initDetector();
  });

  async function runPoseEstimationOnCurrentFrame() {
    if (!detector) return;

    const small = document.createElement("canvas");
    const sctx = small.getContext("2d");
    small.width = 256;
    small.height = 256;
    sctx.drawImage(canvas, 0, 0, 256, 256);

    const poses = await detector.estimatePoses(small);
    if (!poses || poses.length === 0) {
      joints = [];
      com = null;
      return;
    }

    const kp = poses[0].keypoints;
    const scaleX = canvas.width / 256;
    const scaleY = canvas.height / 256;

    joints = KP_DEF.map(def => {
      const p = kp[def.id];
      const visible = p.score >= SCORE_TH || (def.name.includes("Ear") && p.score >= 0.2);

      return {
        x: p.x * scaleX,
        y: p.y * scaleY,
        part: def.name,
        side: def.side,
        estimated: !visible,
        score: p.score
      };
    });

    updateCOM();
    layoutMissingJointsLegend();
  }

  function drawCurrentFrame() {
    if (video.readyState < 2) return;

    const w = video.videoWidth;
    const h = video.videoHeight;

    canvas.width = w;
    canvas.height = h;

    ctx.clearRect(0, 0, w, h);

    ctx.save();
    ctx.translate(w / 2, h / 2);
    ctx.rotate(rotationAngle);
    ctx.drawImage(video, -w / 2, -h / 2, w, h

    );
    ctx.restore();
  }

function redrawAll() {
  if (mode === "startup") return;   // ★ ロゴを守る

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  drawCurrentFrame();

  if (mode !== "analysis") {
    drawHorizontalPoints();
    drawCalibrationPoints();
  }

  drawPosePoints();
  drawMissingJointsLegend();

  const frameLabel = document.getElementById("frameNumber");

  if (mode === "analysis") {
    frameLabel.textContent = currentFrame + 1;
  } else {
    frameLabel.textContent = "–";
  }
}

  async function seekToFrame(frame) {
    return new Promise(resolve => {
      let done = false;

      const handler = () => {
        if (!done) {
          done = true;
          video.removeEventListener("seeked", handler);
          resolve();
        }
      };

      video.addEventListener("seeked", handler);

      video.currentTime = frame * frameDuration;
      video.pause();

      setTimeout(() => {
        if (!done) {
          done = true;
          video.removeEventListener("seeked", handler);
          resolve();
        }
      }, 200);
    });
  }

  async function processNextFrame() {
    if (currentFrame >= totalFrames) {
      message.textContent = "Analysis complete.";
      mode = "done";
      return;
    }

    await seekToFrame(currentFrame);
    drawCurrentFrame();
    await runPoseEstimationOnCurrentFrame();
    redrawAll();

    frameData[currentFrame] = JSON.parse(JSON.stringify(joints));

if (mode === "analysis") {
  frameNumberSpan.textContent = currentFrame + 1;
} else {
  frameNumberSpan.textContent = "–";
}
  }

  /* ===== Part 1 End ===== */

  /* ===== Part 2 Start ===== */

  /* ====== クリック処理 ====== */
  canvas.addEventListener("click", (e) => {
    const { x, y } = getCanvasCoordinates(e);

    if (mode === "horizontal") {
      if (horizontalPoints.length >= 2) return;

      horizontalPoints.push({ x, y });

      if (horizontalPoints.length === 1) {
        message.textContent = "Horizontal Adjustment: Click the second point.";
        redrawAll();
        return;
      }

      if (horizontalPoints.length === 2) {
        const dx = horizontalPoints[1].x - horizontalPoints[0].x;
        const dy = horizontalPoints[1].y - horizontalPoints[0].y;
        rotationAngle = -Math.atan2(dy, dx);

        calibrationPoints = [];
        mode = "calibration";
        message.textContent = "Calibration: Click the first point.";
        redrawAll();
        return;
      }
    }

    if (mode === "calibration") {
      if (calibrationPoints.length >= 2) return;

      calibrationPoints.push({ x, y });

      if (calibrationPoints.length === 1) {
        message.textContent = "Calibration: Click the second point.";
        redrawAll();
        return;
      }

      if (calibrationPoints.length === 2) {
        redrawAll();

        setTimeout(() => {
          const dx = calibrationPoints[1].x - calibrationPoints[0].x;
          const dy = calibrationPoints[1].y - calibrationPoints[0].y;
          const pixelDist = Math.hypot(dx, dy);

          let realDist = prompt(
            "Input the actual distance (meters) between the two selected points.\nCancel restarts calibration.",
            "1.0"
          );

          if (realDist === null) {
            horizontalPoints = [];
            calibrationPoints = [];
            rotationAngle = 0;
            calibrationScale = 1;

            mode = "horizontal";
            message.textContent = "Horizontal Adjustment: Click the first point.";
            showInstruction("Use the scroll bar to move through frames.");
            redrawAll();
            return;
          }

          realDist = parseFloat(realDist);
          if (!realDist || realDist <= 0) realDist = 1.0;

          calibrationScale = realDist / pixelDist;

          let fpsChoice = prompt(
            "Input fps:\n30 / 60 / 90 / 120 / 240 / Custom\nCancel = default (29.97)",
            "30"
          );

          function toActualFPS(n) {
            if (n === 30) return 29.97;
            if (n === 60) return 59.94;
            if (n === 90) return 90.00;
            if (n === 120) return 119.88;
            if (n === 240) return 239.76;
            return n;
          }

          let fpsNum = 30;

          if (!fpsChoice || fpsChoice.trim() === "") {
            fpsNum = 30;
          } else {
            fpsChoice = fpsChoice.trim().toLowerCase();
            if (["30","60","90","120","240"].includes(fpsChoice)) {
              fpsNum = parseFloat(fpsChoice);
            } else {
              let custom = prompt("Input real fps", "30");
              let v = parseFloat(custom);
              if (!v || v <= 0) v = 30;
              fpsNum = v;
            }
          }

          fps = toActualFPS(fpsNum);
          frameDuration = 1 / fps;
          totalFrames = Math.floor(video.duration * fps);

          currentFrame = Math.round(video.currentTime * fps);
          mode = "ready";
          message.textContent = "Analysis Ready: Press Start Analysis.";

          showInstruction(
            `Use the <span style="color:red;">scroll bar</span> or <span style="color:red;">arrow keys</span> to move through frames.`
          );

          redrawAll();
        }, 0);

        return;
      }
    }
  });

  /* ====== イベント記録 ====== */
  document.querySelectorAll(".event-row").forEach(row => {
    const btn = row.querySelector("button");
    const input = row.querySelector("input");

    btn.addEventListener("click", () => {
      if (mode !== "analysis") {
        alert("Events can only be recorded during analysis.");
        return;
      }

      const label = input.value.trim() !== "" ? input.value.trim() : btn.textContent;

      eventLogs.push({
        frame: currentFrame,
        label: label
      });

      alert(`Memorized Event ${label}.`);
      btn.blur();
    });
  });

  /* ====== ドラッグ補正 ====== */
  canvas.addEventListener("mousedown", (e) => {
    if (mode !== "analysis") return;

    const { x, y } = getCanvasCoordinates(e);

    draggingIndex = null;
    joints.forEach((j, i) => {
      if (j.x != null && j.y != null) {
if (Math.hypot(j.x - x, j.y - y) < 15 * SCALE_UI) {
  draggingIndex = i;
}

      }
    });
  });

  canvas.addEventListener("mousemove", (e) => {
    if (draggingIndex === null) return;

    const { x, y } = getCanvasCoordinates(e);

    joints[draggingIndex].x = x;
    joints[draggingIndex].y = y;
    joints[draggingIndex].estimated = false;

    updateCOM();
    redrawAll();
  });

  canvas.addEventListener("mouseup", () => {
    if (draggingIndex !== null && mode === "analysis") {
      frameData[currentFrame] = JSON.parse(JSON.stringify(joints));
    }
    draggingIndex = null;
  });

  /* ===== Part 2 続く ===== */

  /* ====== キー操作 ====== */
  document.body.addEventListener("keydown", async (e) => {
if (
  e.key === "ArrowRight" ||
  e.key === "ArrowLeft"  ||
  e.key === "ArrowUp"    ||   // ★ 追加
  e.key === "ArrowDown"       // ★ 追加
) {
  e.preventDefault();
}


    if (mode !== "ready" && mode !== "analysis") return;

    if (e.key === "Enter") {
      if (mode !== "analysis") return;

      currentFrame++;
      processNextFrame();
      return;
    }

    if (e.key === "Escape") {
      if (mode !== "analysis") return;
      if (currentFrame <= 0) return;

      currentFrame--;
      await seekToFrame(currentFrame);
      drawCurrentFrame();
      await runPoseEstimationOnCurrentFrame();
      redrawAll();
if (mode === "analysis") {
  frameNumberSpan.textContent = currentFrame + 1;
} else {
  frameNumberSpan.textContent = "–";
}

      frameSlider.value = currentFrame * frameDuration;
      return;
    }

if (e.key === "ArrowRight") {
  if (mode !== "ready") return;   // ★ 追加：ready 以外は無効

  if (currentFrame >= totalFrames - 1) return;


      currentFrame++;
      await seekToFrame(currentFrame);
      drawCurrentFrame();

      if (mode === "analysis") {
        await runPoseEstimationOnCurrentFrame();
        frameData[currentFrame] = JSON.parse(JSON.stringify(joints));
      }

      redrawAll();
if (mode === "analysis") {
  frameNumberSpan.textContent = currentFrame + 1;
} else {
  frameNumberSpan.textContent = "–";
}

      frameSlider.value = currentFrame * frameDuration;
      return;
    }

if (e.key === "ArrowLeft") {
  if (mode !== "ready") return;   // ★ ready 以外は無効

  if (currentFrame <= 0) return;

  currentFrame--;
  await seekToFrame(currentFrame);
  drawCurrentFrame();
  redrawAll();
  frameSlider.value = currentFrame * frameDuration;
  return;
}
  });

  /* ====== スライダー ====== */
  window.addEventListener("resize", resizeCanvasToFit);

frameSlider.addEventListener("input", async () => {

  /* ====== フィルタ処理（Butterworth + Winter residual） ====== */
  function butterworth2Coefficients(fs, fc) {
    const ita = 1 / Math.tan(Math.PI * fc / fs);
    const q = Math.SQRT2;

    let b0 = 1 / (1 + q * ita + ita * ita);
    let b1 = 2 * b0;
    let b2 = b0;

    let a1 = 2 * (ita * ita - 1) * b0;
    let a2 = (1 - q * ita + ita * ita) * b0;

    const gain = (b0 + b1 + b2) / (1 + a1 + a2);
    b0 /= gain;
    b1 /= gain;
    b2 /= gain;

    return { b: [b0, b1, b2], a: [1, a1, a2] };
  }

  function iirFilter(x, b, a) {
    const y = new Array(x.length).fill(0);

    for (let n = 0; n < x.length; n++) {
      y[n] = b[0] * x[n]
           + (n - 1 >= 0 ? b[1] * x[n - 1] : 0)
           + (n - 2 >= 0 ? b[2] * x[n - 2] : 0)
           - (n - 1 >= 0 ? a[1] * y[n - 1] : 0)
           - (n - 2 >= 0 ? a[2] * y[n - 2] : 0);
    }
    return y;
  }

  function zeroPhaseFilter(x, fs, fc) {
    const { b, a } = butterworth2Coefficients(fs, fc);

    let y = iirFilter(x, b, a);
    y = iirFilter(y.slice().reverse(), b, a).reverse();

    return y;
  }

  function residualRMS(orig, filt) {
    let sum = 0;
    let count = 0;

    for (let i = 0; i < orig.length; i++) {
      if (orig[i] == null) continue;
      const d = orig[i] - filt[i];
      sum += d * d;
      count++;
    }
    if (count === 0) return 0;
    return Math.sqrt(sum / count);
  }

  function linearRegression(xs, ys) {
    const n = xs.length;
    if (n === 0) return { a: 0, b: 0 };

    let sumX = 0, sumY = 0, sumXY = 0, sumXX = 0;
    for (let i = 0; i < n; i++) {
      const x = xs[i];
      const y = ys[i];
      sumX += x;
      sumY += y;
      sumXY += x * y;
      sumXX += x * x;
    }
    const denom = n * sumXX - sumX * sumX;
    if (denom === 0) return { a: 0, b: sumY / n };

    const a = (n * sumXY - sumX * sumY) / denom;
    const b = (sumY - a * sumX) / n;
    return { a, b };
  }

  function fillMissing(orig) {
    const filled = [...orig];

    let first = filled.find(v => v != null);
    if (first == null) {
      for (let i = 0; i < filled.length; i++) filled[i] = 0;
      return filled;
    }

    for (let i = 0; i < filled.length; i++) {
      if (filled[i] == null) filled[i] = first;
      else break;
    }

    for (let i = 1; i < filled.length; i++) {
      if (filled[i] == null) filled[i] = filled[i - 1];
    }

    return filled;
  }

  function winterResidualAnalysis(orig, fs) {
    const nyquist = fs / 2;
    const maxFc = Math.min(12, nyquist * 0.8);
    const baseCandidates = [4, 6, 8, 10, 12, 14, 16, 18, 20];
    const candidates = baseCandidates.filter(fc => fc < maxFc);

    const filled = fillMissing(orig);

    const rmsList = [];
    const filtList = [];

    for (let i = 0; i < candidates.length; i++) {
      const fc = candidates[i];
      const filt = zeroPhaseFilter(filled, fs, fc);
      const rms = residualRMS(orig, filt);
      rmsList.push(rms);
      filtList.push(filt);
    }

    const lowXs = candidates.slice(0, 3);
    const lowYs = rmsList.slice(0, 3);
    const { a, b } = linearRegression(lowXs, lowYs);

    let bestIdx = 0;
    let bestDiff = Infinity;
    for (let i = 0; i < candidates.length; i++) {
      const fc = candidates[i];
      const lineVal = a * fc + b;
      const diff = Math.abs(rmsList[i] - lineVal);
      if (diff < bestDiff) {
        bestDiff = diff;
        bestIdx = i;
      }
    }

    const bestFc = candidates[bestIdx];
    const bestFilt = filtList[bestIdx];

    return { fc: bestFc, filtered: bestFilt };
  }

  /* ===== Part 2 End ===== */

/* ============================================================

function drawStartupLogo() {
  const ctx = canvas.getContext("2d");
  const img = new Image();
  img.src = "logo-banner.png";

  img.onload = () => {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const padding = 40;

    // ★ 画像の本来のアスペクト比を使う
    const aspect = img.width / img.height;

    const width = canvas.width - padding * 2;
    const height = width / aspect;   // ← これで縦横比が正しくなる

    const x = padding;
    const y = (canvas.height - height) / 2;

    ctx.globalAlpha = 1.0;  // ← 色を薄くしない
    ctx.drawImage(img, x, y, width, height);
  };
}



/* ============================================================
     ★ Excel 保存方式に完全対応した runSaveProcess（最終版）
     ============================================================ */
  function runSaveProcess(saveRaw, saveFiltered) {

    /* ---------- 1. 前処理：frameData のトリミング ---------- */
    let firstValidIndex = 0;
    for (let i = 0; i < frameData.length; i++) {
      const jf = frameData[i];
      if (jf && jf.length > 0) {
        firstValidIndex = i;
        break;
      }
    }
    const trimmedFrameData = frameData.slice(firstValidIndex);

    let baselineY = 0;
    if (horizontalPoints.length >= 2) {
      baselineY = (horizontalPoints[0].y + horizontalPoints[1].y) / 2;
    }
    const scale = calibrationScale || 1.0;

    /* ---------- 2. Raw データ生成（AoA形式） ---------- */
    const header = [
      "Frame No.","Time (s)","COM-X (m)","COM-Y (m)",
      "R-Ear-X (m)","R-Ear-Y (m)","L-Ear-X (m)","L-Ear-Y (m)",
      "R-Shoulder-X (m)","R-Shoulder-Y (m)","L-Shoulder-X (m)","L-Shoulder-Y (m)",
      "R-Elbow-X (m)","R-Elbow-Y (m)","L-Elbow-X (m)","L-Elbow-Y (m)",
      "R-Wrist-X (m)","R-Wrist-Y (m)","L-Wrist-X (m)","L-Wrist-Y (m)",
      "R-Hip-X (m)","R-Hip-Y (m)","L-Hip-X (m)","L-Hip-Y (m)",
      "R-Knee-X (m)","R-Knee-Y (m)","L-Knee-X (m)","L-Knee-Y (m)",
      "R-Ankle-X (m)","R-Ankle-Y (m)","L-Ankle-X (m)","L-Ankle-Y (m)",
      "Event"
    ];

    const rowsRaw = [];
    rowsRaw.push(header);

    const seriesMap = {};
    KP_DEF.forEach(def => {
      seriesMap[def.name] = { x: [], y: [] };
    });

    for (let f = 0; f < trimmedFrameData.length; f++) {
      const jointsFrame = trimmedFrameData[f];

      if (!jointsFrame || jointsFrame.length === 0) {
        KP_DEF.forEach(def => {
          seriesMap[def.name].x.push(null);
          seriesMap[def.name].y.push(null);
        });
        continue;
      }

      const hasEstimated = jointsFrame.some(j => j.estimated);

      let sumX = 0, sumY = 0, count = 0;
      jointsFrame.forEach(j => {
        if (!j.estimated && j.x != null && j.y != null) {
          const x0 = j.x * scale;
          const y0 = -(j.y - baselineY) * scale;
          sumX += x0;
          sumY += y0;
          count++;
        }
      });
      const comX = (count > 0) ? (sumX / count) : null;
      const comY = (count > 0) ? (sumY / count) : null;

      function getJoint(defName) {
        return jointsFrame.find(j => j.part === defName) || null;
      }
      function conv(j) {
        if (!j || j.estimated || j.x == null || j.y == null) return { x: null, y: null };
        return {
          x: j.x * scale,
          y: -(j.y - baselineY) * scale
        };
      }

      const jointConv = {};
      KP_DEF.forEach(def => {
        jointConv[def.name] = conv(getJoint(def.name));
      });

      KP_DEF.forEach(def => {
        const p = jointConv[def.name];
        seriesMap[def.name].x.push(p.x);
        seriesMap[def.name].y.push(p.y);
      });

function fmt(v) {
  return (v == null) ? null : Number(v.toFixed(3));
}


      const timeSec = f / fps;

const row = [
  f + 1,                                 // 数値のまま
  Number(timeSec.toFixed(3)),            // 数値に戻す
  hasEstimated ? null : fmt(comX),       // "" ではなく null の方が安全
  hasEstimated ? null : fmt(comY),

  fmt(jointConv["R-Ear"].x), fmt(jointConv["R-Ear"].y),
  fmt(jointConv["L-Ear"].x), fmt(jointConv["L-Ear"].y),

  fmt(jointConv["R-Shoulder"].x), fmt(jointConv["R-Shoulder"].y),
  fmt(jointConv["L-Shoulder"].x), fmt(jointConv["L-Shoulder"].y),

  fmt(jointConv["R-Elbow"].x), fmt(jointConv["R-Elbow"].y),
  fmt(jointConv["L-Elbow"].x), fmt(jointConv["L-Elbow"].y),

  fmt(jointConv["R-Wrist"].x), fmt(jointConv["R-Wrist"].y),
  fmt(jointConv["L-Wrist"].x), fmt(jointConv["L-Wrist"].y),

  fmt(jointConv["R-Hip"].x), fmt(jointConv["R-Hip"].y),
  fmt(jointConv["L-Hip"].x), fmt(jointConv["L-Hip"].y),

  fmt(jointConv["R-Knee"].x), fmt(jointConv["R-Knee"].y),
  fmt(jointConv["L-Knee"].x), fmt(jointConv["L-Knee"].y),

  fmt(jointConv["R-Ankle"].x), fmt(jointConv["R-Ankle"].y),
  fmt(jointConv["L-Ankle"].x), fmt(jointConv["L-Ankle"].y),

  (eventLogs.find(e => e.frame === f + firstValidIndex)?.label || "")
];


      rowsRaw.push(row);
    }

  /* ===== Part 3 続く ===== */

    /* ---------- 3. Filtered の可否判定 ---------- */
    let hasMissing = false;
    KP_DEF.forEach(def => {
      const arrX = seriesMap[def.name].x;
      const arrY = seriesMap[def.name].y;
      if (arrX.some(v => v == null) || arrY.some(v => v == null)) {
        hasMissing = true;
      }
    });

    const tooFewFrames = trimmedFrameData.length < 20;

    let allowFiltered = saveFiltered;
    let msg = "";

    if (allowFiltered && hasMissing && !tooFewFrames) {
      allowFiltered = false;
      msg = "Only the raw-data was saved because the analysis included unextracted coordinates.";
    } else if (allowFiltered && !hasMissing && tooFewFrames) {
      allowFiltered = false;
      msg = "Only the raw-data was saved because the number of frames is too less (no less than 20).";
    } else if (allowFiltered && hasMissing && tooFewFrames) {
      allowFiltered = false;
      msg = "Only the raw-data was saved because the analysis included unextracted coordinates. Also, the number of frames is too less (no less than 20).";
    }

    /* ---------- 4. Filtered データ生成 ---------- */
    let rowsFiltered = null;

    if (allowFiltered) {
      const filteredMap = {};
      const cfMap = {};

      KP_DEF.forEach(def => {
        const name = def.name;
        const sx = seriesMap[name].x;
        const sy = seriesMap[name].y;

        const resX = winterResidualAnalysis(sx, fps);
        const resY = winterResidualAnalysis(sy, fps);

        filteredMap[name] = {
          x: resX.filtered,
          y: resY.filtered
        };
        cfMap[name] = {
          x: resX.fc,
          y: resY.fc
        };
      });

      rowsFiltered = [];
      rowsFiltered.push(header);

      for (let f = 0; f < trimmedFrameData.length; f++) {
        let sumX = 0, sumY = 0, count = 0;
        KP_DEF.forEach(def => {
          const x = filteredMap[def.name].x[f];
          const y = filteredMap[def.name].y[f];
          if (x != null && y != null) {
            sumX += x;
            sumY += y;
            count++;
          }
        });
        const comXf = (count > 0) ? (sumX / count) : null;
        const comYf = (count > 0) ? (sumY / count) : null;

function fmt(v) {
  return (v == null) ? null : Number(v.toFixed(3));
}


        const timeSec = f / fps;
        const blank = (f < 4 || f >= trimmedFrameData.length - 4);

const row = [
  f + 1,                                   // 数値のまま
  Number(timeSec.toFixed(3)),              // 数値に戻す

  blank ? null : fmt(comXf),               // "" ではなく null
  blank ? null : fmt(comYf),

  blank ? null : fmt(filteredMap["R-Ear"].x[f]), blank ? null : fmt(filteredMap["R-Ear"].y[f]),
  blank ? null : fmt(filteredMap["L-Ear"].x[f]), blank ? null : fmt(filteredMap["L-Ear"].y[f]),

  blank ? null : fmt(filteredMap["R-Shoulder"].x[f]), blank ? null : fmt(filteredMap["R-Shoulder"].y[f]),
  blank ? null : fmt(filteredMap["L-Shoulder"].x[f]), blank ? null : fmt(filteredMap["L-Shoulder"].y[f]),

  blank ? null : fmt(filteredMap["R-Elbow"].x[f]), blank ? null : fmt(filteredMap["R-Elbow"].y[f]),
  blank ? null : fmt(filteredMap["L-Elbow"].x[f]), blank ? null : fmt(filteredMap["L-Elbow"].y[f]),

  blank ? null : fmt(filteredMap["R-Wrist"].x[f]), blank ? null : fmt(filteredMap["R-Wrist"].y[f]),
  blank ? null : fmt(filteredMap["L-Wrist"].x[f]), blank ? null : fmt(filteredMap["L-Wrist"].y[f]),

  blank ? null : fmt(filteredMap["R-Hip"].x[f]), blank ? null : fmt(filteredMap["R-Hip"].y[f]),
  blank ? null : fmt(filteredMap["L-Hip"].x[f]), blank ? null : fmt(filteredMap["L-Hip"].y[f]),

  blank ? null : fmt(filteredMap["R-Knee"].x[f]), blank ? null : fmt(filteredMap["R-Knee"].y[f]),
  blank ? null : fmt(filteredMap["L-Knee"].x[f]), blank ? null : fmt(filteredMap["L-Knee"].y[f]),

  blank ? null : fmt(filteredMap["R-Ankle"].x[f]), blank ? null : fmt(filteredMap["R-Ankle"].y[f]),
  blank ? null : fmt(filteredMap["L-Ankle"].x[f]), blank ? null : fmt(filteredMap["L-Ankle"].y[f]),

  (eventLogs.find(e => e.frame === f + firstValidIndex)?.label || "")
];

        rowsFiltered.push(row);
      }

      const cfRow = [];
      cfRow.push("cf-freq","","","");

      function pushCf(name) {
cfRow.push(Math.round(cfMap[name].x));
cfRow.push(Math.round(cfMap[name].y));

      }

      pushCf("R-Ear");
      pushCf("L-Ear");
      pushCf("R-Shoulder");
      pushCf("L-Shoulder");
      pushCf("R-Elbow");
      pushCf("L-Elbow");
      pushCf("R-Wrist");
      pushCf("L-Wrist");
      pushCf("R-Hip");
      pushCf("L-Hip");
      pushCf("R-Knee");
      pushCf("L-Knee");
      pushCf("R-Ankle");
      pushCf("L-Ankle");

      cfRow.push("");
      rowsFiltered.push(cfRow);
    }

    /* ---------- 5. Excel 1ファイル保存 ---------- */

    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, "0");
    const dd = String(now.getDate()).padStart(2, "0");
    const hh = String(now.getHours()).padStart(2, "0");
    const mi = String(now.getMinutes()).padStart(2, "0");

    const baseFilename = `CoodinateData-${yyyy}${mm}${dd}-${hh}${mi}`;

    const wb = XLSX.utils.book_new();

    if (saveRaw) {
      const wsRaw = XLSX.utils.aoa_to_sheet(rowsRaw);
      XLSX.utils.book_append_sheet(wb, wsRaw, "Raw");
    }

    if (allowFiltered && rowsFiltered) {
      const wsFiltered = XLSX.utils.aoa_to_sheet(rowsFiltered);
      XLSX.utils.book_append_sheet(wb, wsFiltered, "Filtered");
    }

    XLSX.writeFile(wb, baseFilename + ".xlsx");

    if (saveRaw && allowFiltered) {
      alert("Raw- and filtered data were saved completely (Excel file).");
    } else if (saveRaw && !allowFiltered && msg) {
      alert(msg);
    }

const next = confirm("Proceed New Analysis?\nCancel = Close Program");
if (next) {
  mode = "startup";
  drawStartupLogo();
  location.reload();
} else {
  window.close();
}
  }

  /* ===== Part 3 End ===== */

startAnalysisBtn.addEventListener("click", async () => {
  if (mode !== "ready") {
    alert("Calibration is not completed yet.");
    return;
  }

  startAnalysisBtn.blur();

  mode = "analysis";
  message.textContent = "Analyzing...";

  // ★ まず以前のメッセージを消す
  showInstruction("");

  // ★ keyHint（Enter / Esc の説明）を表示
  document.getElementById("keyHint").style.display = "block";

  currentFrame = Math.round(video.currentTime * fps);
  frameData = [];

  await processNextFrame();
});


finishBtn.addEventListener("click", () => {
  if (mode !== "analysis") {
    alert("Analysis has not started yet.");
    return;
  }

  // ★ 解析終了なので keyHint を隠す
  document.getElementById("keyHint").style.display = "none";

  const saveRaw = true;
  const saveFiltered = confirm("Save the raw and (if possible) the filtered data in Excel format?\nCancel = No");

  runSaveProcess(saveRaw, saveFiltered);
});

  /* ====== 座標変換 ====== */
  function getCanvasCoordinates(e) {
    const rect = canvas.getBoundingClientRect();
    const x = (e.clientX - rect.left) * (canvas.width / rect.width);
    const y = (e.clientY - rect.top) * (canvas.height / rect.height);
    return { x, y };
  }



  /* ===== Part 4 End ===== */
</script>
